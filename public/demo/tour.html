<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tour virtual (demonstração)</title>
<style>
*{box-sizing:border-box;margin:0}html,body{height:100%;background:#012439;color:#fff;font-family:system-ui,Segoe UI,Arial,sans-serif;overflow:hidden}
#cena{position:absolute;inset:0;background-size:cover;background-position:center;transition:opacity .5s;animation:kb 18s ease-in-out infinite alternate}
@keyframes kb{from{transform:scale(1) translateX(0)}to{transform:scale(1.12) translateX(-2%)}}
#veu{position:absolute;inset:0;background:linear-gradient(180deg,rgba(1,36,57,.55),transparent 30%,transparent 60%,rgba(1,36,57,.85))}
#nome{position:absolute;left:18px;top:14px;font-weight:700;font-size:18px;text-shadow:0 1px 6px #000}
#sel{position:absolute;right:14px;top:14px;font-size:11px;letter-spacing:.14em;background:rgba(0,0,0,.4);padding:5px 9px;border-radius:99px}
#bar{position:absolute;left:0;right:0;bottom:0;display:flex;gap:10px;padding:12px;overflow:auto;justify-content:center}
.th{flex:0 0 auto;width:112px;height:68px;border-radius:10px;border:2px solid transparent;background-size:cover;background-position:center;cursor:pointer;position:relative;opacity:.8}
.th.on{border-color:#c9a227;opacity:1}.th span{position:absolute;left:5px;bottom:3px;font-size:11px;font-weight:700;text-shadow:0 1px 4px #000}
.seta{position:absolute;top:50%;transform:translateY(-50%);width:44px;height:44px;border-radius:50%;border:0;background:rgba(255,255,255,.9);color:#012439;font-size:22px;font-weight:700;cursor:pointer}
#ant{left:12px}#prox{right:12px}
</style></head><body>
<div id="cena"></div><div id="veu"></div>
<div id="nome"></div><div id="sel">TOUR 360 · DEMONSTRAÇÃO</div>
<button class="seta" id="ant" aria-label="Ambiente anterior">‹</button><button class="seta" id="prox" aria-label="Próximo ambiente">›</button>
<div id="bar"></div>
<script>
var SET={
 casa:[["Fachada e jardim","/fotos/destaque-1a.jpg"],["Cozinha integrada","/fotos/destaque-1c.jpg"],["Entrada","/fotos/destaque-2c.jpg"],["Frente","/fotos/destaque-2b.jpg"]],
 apartamento:[["Sala e cozinha","/demo/fotos/apto-1.jpg"],["Sala de estar","/demo/fotos/apto-2.jpg"],["Estar e jantar","/demo/fotos/apto-3.jpg"]],
 terreno:[["Vista aérea do loteamento","/demo/fotos/terreno-1.jpg"],["Ruas e quadras","/demo/fotos/terreno-2.jpg"],["Lotes disponíveis","/demo/fotos/terreno-3.jpg"],["Entorno","/demo/fotos/terreno-4.jpg"]],
 sobrado:[["Fachada","/fotos/destaque-3a.jpg"],["Lateral","/fotos/destaque-3b.jpg"],["Área externa","/fotos/destaque-3c.jpg"],["Piscina","/demo/fotos/sobrado-extra.jpg"]]
};
var k=(new URLSearchParams(location.search).get("i")||"casa"),L=SET[k]||SET.casa,n=0;
var bar=document.getElementById("bar"),cena=document.getElementById("cena"),nome=document.getElementById("nome");
L.forEach(function(a,i){var d=document.createElement("div");d.className="th";d.style.backgroundImage="url("+a[1]+")";d.innerHTML="<span>"+a[0]+"</span>";d.onclick=function(){ir(i)};bar.appendChild(d)});
function ir(i){n=(i+L.length)%L.length;cena.style.opacity=0;setTimeout(function(){cena.style.backgroundImage="url("+L[n][1]+")";cena.style.opacity=1},200);nome.textContent=L[n][0];[].forEach.call(bar.children,function(e,j){e.classList.toggle("on",j===n)})}
document.getElementById("ant").onclick=function(){ir(n-1)};document.getElementById("prox").onclick=function(){ir(n+1)};
document.onkeydown=function(e){if(e.key==="ArrowLeft")ir(n-1);if(e.key==="ArrowRight")ir(n+1)};
ir(0);
</script></body></html>
