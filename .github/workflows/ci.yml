name: CI
on:
  pull_request:
  push:
    branches: [dev]
jobs:
  validar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - run: bun install --frozen-lockfile
      - run: bun run type-check
      - run: bun run lint
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: bun run test
